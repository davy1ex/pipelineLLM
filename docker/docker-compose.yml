services:
  frontend:
    build:
      context: ../frontend
      target: development
    container_name: frontend_dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ../frontend/.env
    environment:
      - VITE_API_URL=http://localhost/api
    networks:
      - app-network

  backend:
    build:
      context: ../backend
      dockerfile: config/Dockerfile
    container_name: backend_dev
    volumes:
      - ../backend:/app
      - ../workflows:/app/workflows
    ports:
      - "5001:5000"
    environment:
      - DOCKER_CONTAINER=1
      - FLASK_PORT=5000
    env_file:
      - ../backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
    container_name: nginx_proxy
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
    # Removed depends_on: backend - nginx can proxy to local backend via host.docker.internal
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

